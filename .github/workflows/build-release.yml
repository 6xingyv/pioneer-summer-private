name: Build and Upload EPUB(Release)

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - 'translate/chapter-*'

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install
        
      - name: Build EPUB
        run: bun run build
        
      - name: Rename EPUB file
        run: |
          EPUB_FILE=$(find . -name "*.epub" -type f | head -n 1)
          if [ -z "$EPUB_FILE" ]; then
            echo "Error: No EPUB file found"
            exit 1
          fi
          
          VERSION=$(date +'%Y%m%d')
          NEW_NAME="红领巾之夏_v${VERSION}.epub"
          mv "$EPUB_FILE" "$NEW_NAME"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          
      - name: Get Commit Messages
        id: get_commits
        run: |
          # 获取最近一个tag到现在的所有提交
          COMMITS=$(git log $(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD --pretty=format:"- %s" | grep -v "Merge")
          # 将提交信息按类型分类
          CHAPTERS=$(echo "$COMMITS" | grep -i "main:" || true)
          FEATURES=$(echo "$COMMITS" | grep -i "feat:" || true)
          FIXES=$(echo "$COMMITS" | grep -i "fix:" || true)
          OTHER=$(echo "$COMMITS" | grep -vi "feat:\|fix:\|main:" || true)
          
          # 生成release notes
          {
            echo -e "\n### 📚 章节更改"
            echo "$CHAPTERS"
            echo "### ✨ 新增功能"
            echo "$FEATURES"
            echo -e "\n### 🐛 问题修复"
            echo "$FIXES"
            echo -e "\n### 🔧 其他更改"
            echo "$OTHER"
          } > release_notes.txt
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "📖 红领巾之夏 v${{ env.VERSION }}"
          tag_name: "v${{ env.VERSION }}"
          body_path: release_notes.txt
          files: 红领巾之夏_v*.epub
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
