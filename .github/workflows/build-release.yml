name: Build and Upload EPUB (Release)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build EPUB
        run: bun run build

      - name: Rename EPUB file
        run: |
          EPUB_FILE=$(find build -name "*.epub" -type f | head -n 1)
          if [ -z "$EPUB_FILE" ]; then
            echo "Error: No EPUB file found"
            exit 1
          fi

          # 生成版本号：日期-hash
          DATE_VERSION=$(date +'%Y%m%d')
          COMMIT_HASH=$(git rev-parse --short=7 HEAD)
          VERSION="${DATE_VERSION}-${COMMIT_HASH}"

          NEW_NAME="Pioneer_Summer_v${VERSION}.epub"
          mv "$EPUB_FILE" "$NEW_NAME"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Get Commit Messages
        id: get_commits
        shell: bash
        env:
          SHELL: /bin/bash
          LANG: en_US.UTF-8
        run: |
          # 配置 git
          git config --global core.quotepath false

          # 获取最新的远程tag
          git fetch --tags

          # 获取当前最新的tag版本
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
          
          if [ -z "$LATEST_TAG" ]; then
            # 如果没有tag,则为首次发布
            echo "### 🎉 首次发布" > release_notes.txt
            exit 0
          fi

          # 获取从最新tag到现在的提交
          COMMITS=$(git log ${LATEST_TAG}..HEAD --pretty=format:"- %s" 2>/dev/null || true)
          if [ -z "$COMMITS" ]; then
            echo "No new commits since last tag"
            echo "### ℹ️ 无新更改" > release_notes.txt
            exit 0
          fi

          # 移除合并提交
          COMMITS=$(echo "$COMMITS" | grep -v "Merge" || true)

          # 分类提交
          CHAPTERS=$(echo "$COMMITS" | { grep -i "main:" || true; })
          FEATURES=$(echo "$COMMITS" | { grep -i "feat:" || true; })
          FIXES=$(echo "$COMMITS" | { grep -i "fix:" || true; })
          OTHER=$(echo "$COMMITS" | { grep -vi "feat:\|fix:\|main:" || true; })

          # 排序章节编号
          CHAPTERS=$(echo "$CHAPTERS" | sort -t'-' -k2 -n)

          # 生成 release notes
          : > release_notes.txt
          [ -n "$CHAPTERS" ] && echo -e "### 📚 章节更改\n$CHAPTERS\n" >> release_notes.txt
          [ -n "$FEATURES" ] && echo -e "### ✨ 新增功能\n$FEATURES\n" >> release_notes.txt
          [ -n "$FIXES" ] && echo -e "### 🐛 问题修复\n$FIXES\n" >> release_notes.txt
          [ -n "$OTHER" ] && echo -e "### 🔧 其他更改\n$OTHER\n" >> release_notes.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "v${{ env.VERSION }}"
          tag_name: "v${{ env.VERSION }}"
          body_path: release_notes.txt
          files: Pioneer_Summer_v*.epub
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
