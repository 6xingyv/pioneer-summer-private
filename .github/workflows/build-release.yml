name: Build and Upload EPUB (Release)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build EPUB
        run: bun run build

      - name: Rename EPUB file
        run: |
          EPUB_FILE=$(find build -name "*.epub" -type f | head -n 1)
          if [ -z "$EPUB_FILE" ]; then
            echo "Error: No EPUB file found"
            exit 1
          fi

          # 生成版本号：日期-hash
          DATE_VERSION=$(date +'%Y%m%d')
          COMMIT_HASH=$(git rev-parse --short=7 HEAD)
          VERSION="${DATE_VERSION}-${COMMIT_HASH}"

          NEW_NAME="Pioneer_Summer_v${VERSION}.epub"
          mv "$EPUB_FILE" "$NEW_NAME"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Get Commit Messages
        id: get_commits
        run: bun run get-commits

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "v${{ env.VERSION }}"
          tag_name: "v${{ env.VERSION }}"
          body_path: release_notes.txt
          files: Pioneer_Summer_v*.epub
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
